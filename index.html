- Alimentação: use as estimativas da seção NUTRIÇÃO (calorias, proteína, água) para orientar em linhas gerais e ajuste pela tendência do peso. Não monte cardápio detalhado nem prescreva suplementos além de whey e creatina (3 a 5 g/dia) quando fizer sentido; indique nutricionista para dieta individual ou quando houver doença, gestação ou histórico de transtorno alimentar.
- Use só exercícios que a academia do aluno tem e evite os que ele não quer.
- Recursos do app que você pode indicar: cronômetro nas séries por tempo (prancha, cardio), "Fazer depois" e "Trocar" quando o aparelho está ocupado, calculadora de anilhas, gráficos de evolução, medidas e fotos de progresso. O app detecta platô (3 treinos sem evoluir) e sugere semana leve quando há sinais de cansaço; nesses casos, oriente variação da mesma família ou a semana leve pelo botão da tela Hoje.
- ACOMPANHAMENTO DE MEDIDAS: o peso (e, se possível, a cintura) é o que mostra se o treino está funcionando. Se não houver registro ou o último tiver mais de 14 dias, peça ao aluno em uma frase, de preferência antes de montar ou revisar um plano ou de analisar a semana. Quando ele informar, chame registrar_medidas. Fotos são opcionais: nunca exija.
- Interprete a tendência: perda de 0,5 a 1% do peso por semana preserva músculo; acima disso, risco de perder massa magra. Para ganhar músculo, 0,25 a 0,5% por semana limita o ganho de gordura. Cintura caindo com peso estável indica recomposição (menos gordura, mais músculo). Diga o que a tendência significa e o que ajustar.
- Esquemas de carga (campo "esquema"): "reta" para iniciantes e exercícios isolados; "piramide" (crescente, ex.: 12-10-8) em compostos de intermediários; "topo" (uma série pesada com 1 repetição na reserva + séries 10% mais leves) em compostos principais quando o foco é força. O app calcula a carga de cada série pela força estimada (1RM) e ajusta a próxima pelo "ainda sairiam".
- Ciclos e volume: com ciclos ativos, o app organiza o treino em 5 ou 6 semanas, com o esforço subindo (de 3 para 1 repetição na reserva) e a última semana leve. Ao fim de cada treino o aluno avalia estímulo e recuperação por músculo e o app acrescenta ou tira 1 série daquele músculo (no máximo 1 ajuste por músculo a cada 6 dias, entre 4 séries semanais e o teto do nível). Ao revisar uma playlist, mantenha os volumes que o app já ajustou, a menos que haja motivo claro para mudar, e explique.
- Faltas e pausas: em "dias fixos" o app avisa o treino perdido e deixa repor; em "sequência" o aluno sempre segue o próximo da fila. Se o aluno falta com frequência ou tem rotina irregular, sugira modo "sequencia". Depois de mais de 14 dias parado, o app já sugere cargas 10% menores (20% após 30 dias); reforce retomar com calma, sem compensar o tempo perdido com treinos mais longos.
- Bi-sets e superséries (campo "bloco"): use quando o tempo for curto. Prefira pares de músculos diferentes ou opostos (supino + remada, rosca + tríceps, extensora + flexora): economizam tempo sem perder resultado. Bi-set do mesmo músculo é técnica de intensidade para intermediários e avançados. Não combine dois compostos pesados (agachamento, terra, stiff) e evite blocos nas 4 primeiras semanas de um iniciante. Em academia cheia, prefira pares no mesmo aparelho ou com halteres por perto (ex.: polia com dois acessórios). Séries iguais dentro do bloco.

SEGURANÇA
- Você não é médico. Se houver "sim" na triagem PAR-Q, ou relato de dor no peito, falta de ar desproporcional, tontura, desmaio, gravidez, cirurgia recente ou dor articular aguda ou persistente: recomende avaliação médica ou fisioterapêutica antes de intensificar e prescreva só opções conservadoras.
- Dor durante um exercício: parar, trocar por uma alternativa sem dor (do mesmo movimento ou outra), reduzir carga e amplitude. Nunca incentive treinar com dor.
- Não indique anabolizantes, remédios, suplementos de risco ou dietas extremas.

ANÁLISE DE TREINOS
- Ao avaliar, use o histórico: constância, progressão de carga e repetições, repetições na reserva (RR: 0 = falha), sensação e dores. Diga o que manter, o que mudar e por quê, com números. Se fizer sentido, proponha a revisão da playlist.

}

function validarProposta(input) {
  const erros = []; const dias = {};
  const mapaDia = { seg: 'seg', segunda: 'seg', ter: 'ter', terca: 'ter', qua: 'qua', quarta: 'qua', qui: 'qui', quinta: 'qui', sex: 'sex', sexta: 'sex', sab: 'sab', sabado: 'sab', dom: 'dom', domingo: 'dom' };
  for (const d of Array.isArray(input?.dias) ? input.dias : []) {
    const k = mapaDia[norm(d?.dia).replace(/[^a-z]/g, '')] || mapaDia[norm(d?.dia).slice(0, 3)];
    if (!k) { erros.push(`dia inválido "${d?.dia}"`); continue; }
    const itens = [];
    for (const it of Array.isArray(d.itens) ? d.itens : []) {
      const id = String(it?.ex || '').trim();
      if (!EX[id]) { erros.push(`id inexistente "${id}"`); continue; }
      const f = FAM[EX[id].fam];
      itens.push({ uid: uid(), ex: id, series: Math.max(1, Math.min(8, parseInt(it.series) || f.p[0])), reps: String(it.reps || f.p[1]).slice(0, 20), desc: Math.max(0, Math.min(300, parseInt(it.descanso ?? it.desc) || f.p[2])), nota: String(it.nota || '').slice(0, 160), esquema: ['piramide', 'topo'].includes(it.esquema) ? it.esquema : 'reta' });
    }
    (Array.isArray(d.itens) ? d.itens : []).filter((it) => EX[String(it?.ex || '').trim()]).forEach((it, n) => { if (it.bloco && itens[n]) itens[n].combo = 'c' + k + String(it.bloco).toUpperCase().slice(0, 2); });
    normalizarCombos(itens);
    for (const b of blocosCombo(itens)) { const nS = Math.max(...itens.slice(b.ini, b.fim + 1).map((x) => x.series)); for (let q = b.ini; q <= b.fim; q++) itens[q].series = nS; }
    if (itens.length) dias[k] = { titulo: String(d.titulo || '').slice(0, 60), itens };
  }
  if (!Object.keys(dias).length && !erros.length) erros.push('nenhum dia com exercícios');
  return { erros, prop: { id: uid(), nome: String(input?.nome || 'Playlist do Coach').slice(0, 60), objetivo: String(input?.objetivo || '').slice(0, 60), descricao: String(input?.descricao || '').slice(0, 400), baseadaEm: S.playlists[input?.baseada_em] ? input.baseada_em : null, modo: input?.modo === 'sequencia' ? 'sequencia' : 'semana', dias, status: 'nova' } };
}

function montarTurnos(conv, comTools) {
  const hist = conv.msgs.slice(-16).map((m) => ({ role: m.r === 'u' ? 'user' : 'assistant', content: (m.t || '').trim() + (m.props?.length ? '\n\n' + m.props.map((p) => `[Cartão de playlist mostrado: "${p.nome}" — ${p.status === 'salva' ? 'o aluno SALVOU' : 'ainda não salvo'}]`).join('\n') : '') || '(sem texto)' }));
  while (hist.length && hist[hist.length - 1].role !== 'user') hist.pop();
  return [{ role: 'user', content: contextoCoach(comTools) }, ...hist];
}
function extrairBlocos(texto) {
  const props = []; let avisos = [];
  const limpo = texto.replace(/```playlist\s*([\s\S]*?)```/g, (m, json) => {
    try { const { erros, prop } = validarProposta(JSON.parse(json)); if (Object.keys(prop.dias).length) props.push(prop); if (erros.length) avisos.push('Alguns exercícios da proposta não existem no catálogo e foram ignorados.'); } catch (e) { avisos.push('Não consegui ler a playlist proposta. Peça para o Coach enviar de novo.'); }
    return '';
  });
  return { limpo: limpo.trim(), props, avisos };
}

async function enviar(txtArg, repetir = false) {
  const ta = $('#coachIn');
  const texto = String(txtArg || ta?.value || UI.prefill || '').trim();
  if (!texto || G.ctl) return;
  let conv = S.conversas[UI.convId];
  if (!conv) { conv = { id: uid(), titulo: texto.replace(/\[\[|\]\]/g, '').slice(0, 60), criadoEm: Date.now(), msgs: [] }; UI.convId = conv.id; }
  if (!repetir) { conv.msgs.push({ r: 'u', t: texto, ts: Date.now() }); UI.prefill = ''; if (ta) ta.value = ''; }
  conv.atualizadoEm = Date.now(); gravar('conversas', conv.id, conv);
  G.ctl = new AbortController(); G.texto = ''; G.props = []; G.convId = conv.id; G.inicio = Date.now(); G.esgotou = false;
  render.forcar = true; render(); rolarChat();
  const fim = (msg) => {
    if (msg.t || msg.props?.length || msg.aviso) conv.msgs.push(msg);
    conv.atualizadoEm = Date.now(); gravar('conversas', conv.id, conv);
    G.ctl = null; G.texto = ''; G.props = [];
    if (UI.tab === 'coach') { render.forcar = true; render(); rolarChat(); } else toast(msg.repetir ? 'O Coach não conseguiu responder' : 'O Coach respondeu');
  };
  const sample = await getSample();
  if (!sample) { S.coachIndisponivel = true; return fim({ r: 'a', t: '', ts: Date.now(), props: [], aviso: AVISO_SEM_CLAUDE, repetir: true }); }
  S.coachIndisponivel = false;
  // vigia: sem nenhuma palavra em 2 minutos, desiste e oferece tentar de novo (antes, o chat ficava travado "pensando")
  const vigia = setInterval(() => { if (!G.ctl) return clearInterval(vigia); if (!G.texto && Date.now() - G.inicio > 120000) { G.esgotou = true; G.ctl.abort(); } else atualizarBolha(); }, 5000);
  let comTools = true;
  try { const lim = await sample.limits(); comTools = !!lim?.tools; } catch (e) { comTools = false; }
  const opcoes = { cache: false, signal: G.ctl.signal, modelTier: S.config.modoCoach === 'complex' ? 'complex' : 'default', onText: ({ text }) => { G.texto = text; atualizarBolha(); } };
  let resp = '', aviso = '', falhou = false;
  const pedir = (ferr) => { const o = { ...opcoes }; if (ferr) o.tools = ferramentasCoach(); else delete o.tools; return sample(montarTurnos(conv, ferr), o); };
  try {
    let r;
    try { r = await pedir(comTools && !S.coachSemFerr); }
    catch (e) {
      // Plano B: se o Claude recusar o formato do pedido com ferramentas, tenta uma vez no modo simples
      // (o Coach responde em texto e manda a playlist num bloco que o app transforma no mesmo cartão)
      if (['invalid_request', 'transform_error', 'tools_unavailable'].includes(e?.code) && comTools && !S.coachSemFerr && !e?.text && !G.ctl.signal.aborted) {
        S.coachSemFerr = e.message || e.code; console.warn('Coach sem ferramentas:', e.code, e.message);
        r = await pedir(false);
      } else throw e;
    }
    resp = r.text; if (r.truncated) aviso = 'A resposta foi cortada. Peça para o Coach continuar.';
  } catch (e) {
    resp = e?.text || ''; falhou = !resp;
    if (e?.code === 'cancelled' || e?.name === 'AbortError') aviso = G.esgotou ? 'O Claude não respondeu em 2 minutos. Se apareceu um pedido de permissão, toque em Permitir; depois, toque em Tentar de novo.' : 'Resposta interrompida.';
    else if (SEM_ACESSO.includes(e?.code)) { S.coachIndisponivel = true; aviso = ERRO_COACH[e.code] || AVISO_SEM_CLAUDE; }
    else if (e?.code === 'refused') { resp = ''; aviso = ERRO_COACH.refused; }
    else aviso = (ERRO_COACH[e?.code] || 'Não consegui falar com o Coach. Toque em Tentar de novo.') + ` [${e?.code || 'erro'}${e?.message ? ': ' + String(e.message).slice(0, 300) : ''}]`;
  } finally { clearInterval(vigia); }
  const { limpo, props, avisos } = extrairBlocos(resp);
  const msg = { r: 'a', t: limpo, ts: Date.now(), props: [...G.props, ...props] };
  if (aviso || avisos.length) msg.aviso = [aviso, ...avisos].filter(Boolean).join(' ');
  if (falhou && !msg.props.length) msg.repetir = true;
  fim(msg);
}

function atualizarBolha() { const b = $('#genBubble'); if (b) { b.innerHTML = bolhaGerando(); } }
function bolhaGerando() {

}

  return `<div class="proposal" style="margin-top:10px">
    <div class="eyebrow">${p.baseadaEm ? 'Revisão de playlist' : 'Playlist proposta'}</div>
    <div class="h3">${esc(p.nome)}</div>
    ${p.objetivo ? `<span class="tag accent" style="align-self:flex-start">${esc(p.objetivo)}</span>` : ''}
    ${p.descricao ? `<p class="small muted">${inlineMd(esc(p.descricao))}</p>` : ''}
    <div class="faint num">${dias.length} ${p.modo === 'sequencia' ? 'treinos em sequência (A → B → C)' : 'dias'} · ${series} séries por semana</div>
    ${dias.map((d) => `<details class="pday"><summary><span>${DIAS_CURTO[d]} · ${esc(p.dias[d].titulo || 'Treino')}</span><span class="faint num">${p.dias[d].itens.length} ex · ≈${duracaoEstimada(p.dias[d].itens)} min</span></summary><ul>${(() => { const inf = infoCombo(p.dias[d].itens); return p.dias[d].itens.map((it, n) => `<li>${inf[n] ? `<span class="ordem">${inf[n].letra}${inf[n].pos}</span> ` : ''}<a href="#" class="exlink" data-a="verEx" data-id="${it.ex}">${esc(exNome(it.ex))}</a> · ${it.series}×${esc(it.reps)}${it.nota ? `<br><span class="faint">${inlineMd(esc(it.nota))}</span>` : ''}</li>`).join(''); })()}</ul></details>`).join('')}
    ${!pronto ? '' : p.status === 'salva' ? `<div class="row"><span class="tag ok">Salva</span><button class="btn sm ghost" data-a="editarPl" data-id="${p.salvaId}">Abrir playlist</button></div>`
      : `<div class="btnrow"><button class="btn sm primary" data-a="salvarProp" data-c="${c}" data-m="${m}" data-k="${k}" data-v="ativar">Salvar e ativar</button><button class="btn sm" data-a="salvarProp" data-c="${c}" data-m="${m}" data-k="${k}" data-v="salvar">Só salvar</button>${antiga ? `<button class="btn sm" data-a="salvarProp" data-c="${c}" data-m="${m}" data-k="${k}" data-v="substituir">Atualizar "${esc(antiga.nome)}"</button>` : ''}</div>`}
  </div>`;
}
A.salvarProp = (el) => {
  const conv = S.conversas[el.dataset.c]; const p = conv?.msgs[+el.dataset.m]?.props?.[+el.dataset.k]; if (!p) return;
  const modo = el.dataset.v;
  const semMarcas = (t) => String(t || '').replace(/\[\[([a-z0-9_]+)\]\]/g, (x, id) => EX[id]?.nome || id.replace(/_/g, ' '));
  const dias = Object.fromEntries(Object.entries(p.dias).map(([k, d]) => [k, { ...d, itens: d.itens.map((it) => ({ ...it, nota: semMarcas(it.nota) })) }]));
  const base = novaPlaylist({ nome: p.nome, objetivo: p.objetivo, descricao: semMarcas(p.descricao), origem: 'coach', modo: p.modo, dias });
  if (modo === 'substituir' && S.playlists[p.baseadaEm]) { base.id = p.baseadaEm; base.criadoEm = S.playlists[p.baseadaEm].criadoEm || Date.now(); }
  gravar('playlists', base.id, base);
  if (modo !== 'salvar') { S.config.playlistAtiva = base.id; gravar('config', null, S.config); }
  p.status = 'salva'; p.salvaId = base.id; gravar('conversas', conv.id, conv);
  render(); toast(modo === 'salvar' ? 'Playlist salva' : modo === 'substituir' ? 'Playlist atualizada e ativa' : 'Playlist salva e ativada');
};

VIEWS.coach = () => {
  const conv = S.conversas[UI.convId];
  const nome = primeiroNome();
  let b = '';
  if (S.coachIndisponivel) b += `<div class="callout warn">O Coach usa o Claude da sua conta e só funciona com o app aberto pelo link do claude.ai, com você conectado e o uso do Claude permitido para este app.</div>`;
  b += '<div class="chat">';
  if (!conv?.msgs?.length) {
    b += `<div class="msg a"><div class="md"><p>${nome ? `Oi, ${esc(nome)}!` : 'Oi!'} Sou seu coach. Monto suas playlists de treino, ajusto o plano quando um aparelho está ocupado ou algo incomoda, e acompanho sua evolução pelos treinos que você registra.</p><p>Para começar, me conte seu objetivo, há quanto tempo treina e quantos dias por semana consegue ir à academia.</p></div></div>
    <div class="chips">${[
      ['Monte meu primeiro treino', 'Quero que você monte meu treino. Pode me fazer as perguntas que precisar.'],
      ['Registrar meu peso', 'Quero registrar meu peso e minhas medidas de hoje.'],
      ['Tenho 3 dias na semana', 'Tenho 3 dias por semana e cerca de 1 hora por treino. Monte uma playlist para mim.'],
      ['Avalie minha semana', 'Avalie meus treinos dos últimos 7 dias e me diga o que ajustar.'],
      ['Aparelho ocupado', 'O aparelho do meu próximo exercício está ocupado. Como escolho a melhor alternativa?'],
      ['Senti um desconforto', 'Senti um desconforto durante um exercício. O que devo fazer?']
    ].map(([t, v]) => `<button class="chip" data-a="promptCoach" data-v="${esc(v)}">${t}</button>`).join('')}</div>`;
  } else {
    conv.msgs.forEach((m, i) => {
      if (m.r === 'u') b += `<div class="msg u">${inlineMd(esc(m.t))}</div>`;
      else b += `<div class="msg a">${m.t ? `<div class="md">${md(m.t)}</div>` : ''}${(m.props || []).map((p, k) => cardProposta(p, conv.id, i, k)).join('')}${m.aviso ? `<p class="faint small" style="margin-top:6px">${esc(m.aviso)}</p>` : ''}${m.repetir && i === conv.msgs.length - 1 && !G.ctl ? '<button class="btn sm" data-a="tentarCoach" style="margin-top:8px">Tentar de novo</button>' : ''}</div>`;
    });
  }
  if (G.ctl && G.convId === UI.convId) b += `<div class="msg a" id="genBubble">${bolhaGerando()}</div>`;
  b += '</div>';
  b += `<div class="composer"><textarea id="coachIn" class="input" rows="1" data-in="coachIn" placeholder="Escreva para o Coach" aria-label="Mensagem para o Coach">${esc(UI.prefill || '')}</textarea>${G.ctl ? `<button class="send stop" data-a="pararCoach" aria-label="Parar">${ICON.stop}</button>` : `<button class="send" data-a="enviarCoach" aria-label="Enviar">${ICON.send}</button>`}</div>`;
  b += `<div class="row between"><div class="chips"><button class="chip sm ${S.config.modoCoach !== 'complex' ? 'on' : ''}" data-a="modoCoach" data-v="default">Rápido</button><button class="chip sm ${S.config.modoCoach === 'complex' ? 'on' : ''}" data-a="modoCoach" data-v="complex">Mais detalhado</button></div><span class="faint" style="font-size:12.5px">Usa o Claude da sua conta</span></div>`;
  return {
    top: topo('Personal trainer com IA', 'Coach', `<button class="iconbtn" data-a="listaConversas" aria-label="Conversas">${ICON.list}</button><button class="iconbtn" data-a="novaConversa" aria-label="Nova conversa">${ICON.plus}</button>`),
    body: b,
    after: () => { if (UI.rolar !== UI.convId) { UI.rolar = UI.convId; rolarChat(); } }
  };
};
IN.coachIn = (el, ev) => { UI.prefill = el.value; el.style.height = 'auto'; el.style.height = Math.min(160, el.scrollHeight) + 'px'; };
document.addEventListener('keydown', (ev) => { if (ev.target.id === 'coachIn' && ev.key === 'Enter' && (ev.metaKey || ev.ctrlKey)) { ev.preventDefault(); enviar(); } });
A.enviarCoach = () => enviar(); // lê o texto direto do campo (o teclado do iPhone às vezes não avisa a última palavra)
A.pararCoach = () => G.ctl?.abort();
A.promptCoach = (el) => enviar(el.dataset.v);
A.modoCoach = (el) => { S.config.modoCoach = el.dataset.v; gravar('config', null, S.config); render(); };
A.novaConversa = () => { if (G.ctl) return toast('Espere o Coach terminar de responder'); UI.convId = null; UI.prefill = ''; render(); };
A.listaConversas = () => {
  abrirSheet(() => {
    const cs = Object.values(S.conversas).sort((a, b) => (b.atualizadoEm || 0) - (a.atualizadoEm || 0));
    return `${shead('Conversas', 'Coach')}
    ${cs.length ? `<div class="card tight">${cs.map((c) => `<div class="exrow"><button class="grow" style="text-align:left" data-a="abrirConversa" data-id="${c.id}"><div class="nm">${esc(c.titulo || 'Conversa')}</div><div class="meta">${fmtData(c.atualizadoEm || c.criadoEm)} · ${c.msgs?.length || 0} mensagens</div></button>${UI.confirmar === 'conv:' + c.id ? `<button class="btn sm danger" data-a="apagarConversa" data-id="${c.id}">Apagar</button>` : `<button class="mini" data-a="pedirApagarConversa" data-id="${c.id}" aria-label="Apagar conversa">${ICON.x}</button>`}</div>`).join('')}</div>` : '<p class="muted">Nenhuma conversa ainda.</p>'}
    <button class="btn primary block" data-a="novaConversa2">${ICON.plus} Nova conversa</button>`;
  });
};
A.abrirConversa = (el) => { if (G.ctl) return toast('Espere o Coach terminar de responder'); UI.convId = el.dataset.id; fecharSheet(); render(); };
A.novaConversa2 = () => { fecharSheet(); A.novaConversa(); };
A.pedirApagarConversa = (el) => { UI.confirmar = 'conv:' + el.dataset.id; renderSheet(); };
A.apagarConversa = (el) => { const id = el.dataset.id; if (G.ctl && G.convId === id) return; gravar('conversas', id, null); if (UI.convId === id) UI.convId = null; UI.confirmar = null; renderSheet(); render(); };

// Início
render();
iniciarArmazenamento();
setInterval(tick, 1000);

function recuperacaoTexto() {
  const est = estadoMuscular();
  const l = Object.entries(est).filter(([, x]) => x.ultimo).map(([m, x]) => `${MUSC[m]} ${x.pct}% (treinado ${fmtHoras(x.horas)}, ${fmtSeries(x.series)} em 7 dias)`);
  return l.length ? l.join('; ') : 'Nenhum músculo treinado nos últimos 7 dias.';
}

function cicloTexto() {
  const c = estadoCiclo(); if (!c) return 'Sem treinos registrados ainda. ' + mesoTexto();
  if (S.config.meso?.inicio) return mesoTexto() + (c.deload ? '' : ` Sinais de cansaço: ${c.motivos.join('; ') || 'nenhum'}. Exercícios em platô: ${c.platos.join(', ') || 'nenhum'}.`);
  if (c.deload) return `Semana leve ativa até ${fmtData(c.ate, { day: '2-digit', month: '2-digit' })}: séries reduzidas e cargas 10% menores.`;
  return `${c.semanas} semana(s) de treino no ciclo atual (semana leve recomendada a cada ${c.alvo}). Sinais de cansaço: ${c.motivos.join('; ') || 'nenhum'}. Exercícios em platô: ${c.platos.map((x) => x).join(', ') || 'nenhum'}.`;
}
function medidasTexto() {
  const ms = medidasOrd(); if (!ms.length) return 'Nenhuma medida registrada ainda. Peça o peso ao aluno.';
  const dias = Math.floor((Date.now() - ms[0].data) / 864e5);
  const linhas = ms.slice(0, 4).map((m) => `- ${fmtData(m.data, { day: '2-digit', month: '2-digit', year: 'numeric' })}: ` + CAMPOS_MED.filter(([k]) => m[k]).map(([k, t, u]) => `${t.toLowerCase()} ${fmtKg(m[k])} ${u}`).join(', ') + (Object.keys(m.fotos || {}).length ? ` (${Object.keys(m.fotos).length} foto(s))` : ''));
  const t = tendenciaMedidas();
  return `Último registro há ${dias} dia(s)${dias > 14 ? ' — DESATUALIZADO: peça o peso atual' : ''}.\n${linhas.join('\n')}${t ? `\nTendência desde o primeiro registro: ${t}.` : ''}`;
}

</script>
