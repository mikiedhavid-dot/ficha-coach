<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#edf0f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#060a14" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ficha Coach">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<title>Ficha Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,600;1,700;1,800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: coluna única de celular (máx. 640px), barra de abas fixa embaixo, folhas (sheets) sobem de baixo.
   Identidade "pista": tinta azul-marinho, cobalto da anilha de 20 kg e amarelo de alta visibilidade só na ação principal.
   Títulos condensados em itálico, números de placar. Esforço usa as cores das anilhas: verde 10 · amarelo 15 · azul 20 · vermelho 25. */
:root {
  --bg: #edf0f5;
  --surface: #ffffff;
  --surface-2: #e2e7f0;
  --ink: #0a1430;
  --ink-2: #3d4863;
  --ink-3: #6c7790;
  --line: #d3d9e4;
  --accent: #1d4ed8;
  --accent-ink: #ffffff;
  --accent-soft: #dde6ff;
  --volt: #ffc21a;
  --volt-ink: #0a1430;
  --hero: #0a1430;
  --hero-2: #1a3478;
  --hero-ink: #f4f7fd;
  --hero-ink-2: #a9b7d8;
  --plate-10: #1e8a4c;
  --plate-15: #c28400;
  --plate-20: #1d4ed8;
  --plate-25: #c8312b;
  --ok: #1e8a4c;
  --warn: #b77a00;
  --bad: #c8312b;
  --shadow: 0 1px 2px rgba(10, 20, 48, .06), 0 6px 20px rgba(10, 20, 48, .08);
  --body: #dfe4ec;
  --mus-off: #c3cad6;
  --mus-sec: #9db4f0;
  --mus-alto: #0f2f8f;
  --f-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif-condensed, system-ui, sans-serif;
  --f-body: 'Barlow', -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif;
  --r: 14px;
  --tabbar-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #060a14; --surface: #0f1729; --surface-2: #18233b; --ink: #eef2fa; --ink-2: #b3bdd3; --ink-3: #7c88a5;
    --line: #23304c; --accent: #7d97ff; --accent-ink: #081030; --accent-soft: #1b2952;
    --volt: #ffd34d; --volt-ink: #0a1430; --hero: #0f1f45; --hero-2: #1d3d8c; --hero-ink: #f4f7fd; --hero-ink-2: #a9b7d8;
    --plate-10: #45c27b; --plate-15: #e3b23c; --plate-20: #7d97ff; --plate-25: #f06a5e;
    --ok: #45c27b; --warn: #e3b23c; --bad: #f06a5e;
    --shadow: 0 1px 2px rgba(0, 0, 0, .45), 0 8px 24px rgba(0, 0, 0, .4);
    --body: #1d2740; --mus-off: #2f3a55; --mus-sec: #3d4f86; --mus-alto: #c3cdff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #060a14; --surface: #0f1729; --surface-2: #18233b; --ink: #eef2fa; --ink-2: #b3bdd3; --ink-3: #7c88a5;
  --line: #23304c; --accent: #7d97ff; --accent-ink: #081030; --accent-soft: #1b2952;
  --volt: #ffd34d; --volt-ink: #0a1430; --hero: #0f1f45; --hero-2: #1d3d8c; --hero-ink: #f4f7fd; --hero-ink-2: #a9b7d8;
  --plate-10: #45c27b; --plate-15: #e3b23c; --plate-20: #7d97ff; --plate-25: #f06a5e;
  --ok: #45c27b; --warn: #e3b23c; --bad: #f06a5e;
  --shadow: 0 1px 2px rgba(0, 0, 0, .45), 0 8px 24px rgba(0, 0, 0, .4);
  --body: #1d2740; --mus-off: #2f3a55; --mus-sec: #3d4f86; --mus-alto: #c3cdff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; height: 100%; }
body {
  margin: 0; height: 100%; height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
  background: var(--bg); color: var(--ink); font: 400 16px/1.45 var(--f-body);
  -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none;
}
body.locked #app { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }

#app { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; padding-top: env(safe-area-inset-top, 0px); }
#app > .topbar, #app > .main { max-width: 640px; margin-inline: auto; }
.main {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 4px 28px;
  display: flex; flex-direction: column; gap: 18px;
}
body.no-tabs .main { padding-bottom: 28px; }

/* Topo */
.topbar {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 10px;
  display: flex; align-items: center; gap: 10px; min-height: 56px;
}
.topbar .t-main { flex: 1; min-width: 0; }
.eyebrow { font: 600 12px/1.2 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.title { font: italic 800 32px/1 var(--f-display); letter-spacing: .01em; text-transform: uppercase; }
.title.sm { font-size: 24px; }
.iconbtn {
  width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--ink-2);
  background: var(--surface); box-shadow: var(--shadow); flex: none;
}
.iconbtn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Abas */
.tabbar {
  position: relative; flex: none; z-index: 30;
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; /* divide a largura entre as abas visíveis */
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
  padding-top: 6px; padding-bottom: max(6px, env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(16px); backdrop-filter: saturate(1.4) blur(16px);
  border-top: 1px solid var(--line);
}
body.no-tabs .tabbar, body.teclado .tabbar { display: none; }
.tab { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; color: var(--ink-3); font: 600 11px/1.1 var(--f-body); letter-spacing: .02em; }
.tab svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tab.on { color: var(--accent); }
.tab.on::before { content: ''; position: absolute; top: -6px; width: 26px; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }

/* Blocos */
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.flat { box-shadow: none; border: 1px solid var(--line); }
.card.tight { padding: 12px; gap: 8px; }
.section { display: flex; flex-direction: column; gap: 10px; }
.section > h2, .h2 { font: italic 700 22px/1.1 var(--f-display); letter-spacing: .01em; }
.h3 { font: 700 18px/1.15 var(--f-display); letter-spacing: .01em; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); font-size: 14px; }
.small { font-size: 14px; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row.wrap { flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.divider { height: 1px; background: var(--line); margin: 2px 0; }

/* Botões */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px;
  padding: 10px 16px; border-radius: 12px; font: 600 15px/1.1 var(--f-body);
  background: var(--surface-2); color: var(--ink); text-align: center;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.big { min-height: 54px; font: 700 20px/1 var(--f-display); letter-spacing: .03em; text-transform: uppercase; border-radius: 14px; }
.btn.ghost { background: transparent; color: var(--accent); padding-inline: 8px; }
.btn.danger { background: transparent; color: var(--bad); }
.btn.sm { min-height: 36px; padding: 7px 12px; font-size: 14px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }
.btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.btnrow > .btn { flex: 1 1 auto; }

/* Chips */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 6px 12px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); font: 600 14px/1 var(--f-body); color: var(--ink-2); white-space: nowrap;
}
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.sm { min-height: 26px; padding: 4px 9px; font-size: 12.5px; }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); font: 600 12.5px/1.2 var(--f-body); white-space: nowrap; }
.tag.accent { background: var(--accent-soft); color: var(--accent); }
.tag.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.tag.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.tag.bad { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }

/* Formulários */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .lbl { font: 600 13px/1.2 var(--f-body); color: var(--ink-2); letter-spacing: .01em; }
.input, select.input, textarea.input {
  width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 11px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font-size: 16px;
}
textarea.input { resize: vertical; min-height: 84px; line-height: 1.4; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; font-size: 15px; }
.check input { width: 22px; height: 22px; margin-top: 1px; accent-color: var(--accent); flex: none; }

/* Semana */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day {
  display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 0 7px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--line); color: var(--ink-2);
}
.day b { font: 700 16px/1 var(--f-display); letter-spacing: .02em; }
.day i { font-style: normal; font-size: 11px; line-height: 1; color: var(--ink-3); min-height: 11px; }
.day.today { border-color: var(--accent); }
.day.sel { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.day.sel i { color: color-mix(in srgb, var(--bg) 70%, transparent); }
.day.done i { color: var(--ok); font-weight: 700; }
.day.sel.done i { color: var(--bg); }

/* Exercícios */
.thumb {
  width: 64px; aspect-ratio: 3 / 2; border-radius: 10px; flex: none; background-color: var(--surface-2);
  background-size: 200% 100%; background-position: 0 0; background-repeat: no-repeat;
}
.thumb.lg { width: 84px; }
img.thumb { display: block; height: auto; object-fit: cover; }
.thumb.at { background-image: url('img/miniaturas.webp'); background-repeat: no-repeat; }
.fotoex { flex: none; border-radius: 14px; overflow: hidden; background: var(--surface-2); }
.fotoex img { display: block; width: 100%; max-height: 340px; object-fit: contain; }
.stats.nut b { white-space: nowrap; font-size: clamp(20px, 6.2vw, 30px); }
.meso .mesobar { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.mesobar i { display: grid; place-items: center; height: 26px; border-radius: 6px; background: var(--surface-2); color: var(--ink-3); font: italic 800 14px/1 var(--f-display); }
.mesobar i.feito { background: var(--accent-soft); color: var(--accent); }
.mesobar i.agora { background: var(--accent); color: var(--accent-ink); }
.mesobar i.leve { color: var(--ok); }
.mesobar i.leve.agora { background: var(--ok); color: #fff; }
.fbmusc { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
.fbmusc > b { font: 700 16px/1.1 var(--f-display); }
.fbrow { display: grid; grid-template-columns: 62px 1fr; gap: 8px; align-items: center; }
.fbrow > span { font-size: 12.5px; color: var(--ink-3); }
.fbrow .chips { gap: 6px; }
.ajuste { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.ajuste b { font-size: 14px; }
.ajuste b.mais { color: var(--ok); }
.ajuste b.menos { color: var(--warn); }
.nivel { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; }
.nivel + .nivel { border-top: 1px solid var(--line); }
.input.mono { font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; }
.dorav { display: flex; flex-direction: column; gap: 8px; font-size: 14px; border-radius: 10px; padding: 10px 12px; background: color-mix(in srgb, var(--warn) 14%, var(--surface)); }
.dorav b { color: var(--ink); }
.bvpassos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.bvpassos i { height: 5px; border-radius: 99px; background: var(--surface-2); }
.bvpassos i.on { background: var(--accent); }
.bvlista { margin: 4px 0 6px; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; color: var(--hero-ink); font-size: 15px; }
.exmini { display: flex; flex-direction: row; align-items: center; gap: 12px; width: 100%; text-align: left; min-width: 0; }
.card.exmini { padding: 10px 14px; gap: 12px; }
.exmini .nm { font: 700 17px/1.15 var(--f-display); }
.exmini .meta { font-size: 13px; color: var(--ink-3); margin-top: 2px; }
.exmini.done { opacity: .72; }
.card.combo .exmini { padding: 4px 0; }
.sheet .fixo { position: sticky; bottom: 0; display: flex; flex-direction: column; gap: 8px; padding: 10px 0 4px; background: var(--bg); box-shadow: 0 -10px 12px -8px var(--bg); }
.conq { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.badge { display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; padding: 12px 6px 10px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); min-width: 0; color: var(--ink); }
.badge .md { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font: italic 800 19px/1 var(--f-display); background: var(--surface-2); color: var(--ink-3); }
.badge.on .md { background: var(--volt); color: var(--volt-ink); box-shadow: inset 0 0 0 4px rgba(10, 20, 48, .14); }
.badge b { font-size: 13px; line-height: 1.15; }
.badge > span:last-child { font-size: 11.5px; color: var(--ink-3); }
.badge:not(.on) b { color: var(--ink-2); }
.resumocv canvas { display: block; width: 100%; height: auto; border-radius: 14px; box-shadow: var(--shadow); }
.thumb.ph { display: grid; place-items: center; font: italic 800 20px/1 var(--f-display); color: var(--accent); background: var(--accent-soft); }
.exrow { display: flex; align-items: center; gap: 12px; padding: 8px 0; min-width: 0; text-align: left; width: 100%; }
.exrow + .exrow { border-top: 1px solid var(--line); }
.exrow .nm { font: 600 16px/1.2 var(--f-body); }
.exrow .meta { font-size: 13.5px; color: var(--ink-3); margin-top: 2px; }
.famhead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }

.anim { flex: none; position: relative; width: 100%; max-width: 100%; aspect-ratio: 3 / 2; border-radius: 14px; overflow: hidden; background: var(--surface-2); }
.anim .fr { position: absolute; inset: 0; background-size: 200% 100%; background-repeat: no-repeat; }
.anim .f0 { background-position: 0 0; }
.anim .f1 { background-position: 100% 0; animation: troca var(--dur, 2.6s) infinite; }
.anim.paused .f1 { animation: none; opacity: var(--fr, 0); }
.anim .dots { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 5px; }
.anim .dots span { width: 7px; height: 7px; border-radius: 50%; background: #fff; opacity: .55; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
.anim .ctrl { position: absolute; right: 8px; bottom: 8px; display: flex; gap: 6px; }
.anim .ctrl button { min-height: 32px; padding: 5px 10px; border-radius: 9px; background: rgba(15, 17, 20, .62); color: #fff; font: 600 13px/1 var(--f-body); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.anim .dots span:first-child { animation: ponto1 var(--dur, 2.6s) infinite; }
.anim .dots span:last-child { animation: troca var(--dur, 2.6s) infinite; }
.anim.paused .dots span { animation: none; }
@keyframes troca { 0%, 42% { opacity: 0; } 50%, 92% { opacity: 1; } 100% { opacity: 0; } }
@keyframes ponto1 { 0%, 42% { opacity: 1; } 50%, 92% { opacity: .35; } 100% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .anim .f1 { animation-duration: 6s; } }

ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 10px; }
ol.steps li { counter-increment: s; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
ol.steps li::before { content: counter(s); width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font: 700 15px/1 var(--f-display); }
ul.list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
ul.list.warn li::marker { color: var(--bad); }
.callout { border-radius: 12px; padding: 12px 14px; background: var(--accent-soft); color: var(--ink); font-size: 15px; }
.callout.warn { background: color-mix(in srgb, var(--warn) 15%, var(--surface)); }
.callout.bad { background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }

/* Treino em andamento */
.wk-head { display: flex; align-items: center; gap: 10px; }
.wk-time { font: 700 26px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.progress { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.exblock { display: flex; flex-direction: column; gap: 10px; }
.exblock.done .exhead .nm { color: var(--ink-2); }
.exhead { display: flex; gap: 12px; align-items: flex-start; }
.exhead .nm { font: 700 19px/1.15 var(--f-display); letter-spacing: .01em; }
.note { font-size: 14px; color: var(--ink-2); background: var(--accent-soft); border-radius: 8px; padding: 6px 10px; }
.goal { font-size: 14px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.sets { display: flex; flex-direction: column; gap: 6px; }
.setrow { display: grid; grid-template-columns: 34px 1fr 1fr 48px; gap: 8px; align-items: center; }
.sethead { font: 600 12px/1 var(--f-body); color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase; }
.setno { font: 700 17px/1 var(--f-display); color: var(--ink-2); text-align: center; }
.setno.aq { font-size: 13px; color: var(--warn); }
.setrow .input { text-align: center; padding: 8px 6px; font: 600 18px/1 var(--f-body); font-variant-numeric: tabular-nums; min-height: 46px; }
.setrow.feito .input { background: color-mix(in srgb, var(--ok) 10%, var(--surface)); border-color: color-mix(in srgb, var(--ok) 35%, var(--line)); }
.okbtn { width: 48px; height: 46px; border-radius: 11px; background: var(--surface-2); display: grid; place-items: center; color: var(--ink-3); }
.okbtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.setrow.feito .okbtn { background: var(--ok); color: #fff; }
.rir { display: flex; align-items: center; gap: 6px; padding-left: 42px; flex-wrap: wrap; }
.rir span { font-size: 12.5px; color: var(--ink-3); }
.rir button { min-width: 38px; min-height: 30px; padding: 4px 8px; border-radius: 8px; border: 1.5px solid var(--line); font: 700 14px/1 var(--f-display); color: var(--ink-2); background: var(--surface); }
.rir button.on[data-r="3"] { background: var(--plate-10); border-color: var(--plate-10); color: #fff; }
.rir button.on[data-r="2"] { background: var(--plate-15); border-color: var(--plate-15); color: #fff; }
.rir button.on[data-r="1"] { background: var(--plate-20); border-color: var(--plate-20); color: #fff; }
.rir button.on[data-r="0"] { background: var(--plate-25); border-color: var(--plate-25); color: #fff; }

.restbar {
  position: relative; flex: none; z-index: 35;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); display: flex; align-items: center; gap: 10px;
}
.restbar .rt { font: 700 34px/1 var(--f-display); font-variant-numeric: tabular-nums; min-width: 86px; }
.restbar .rl { flex: 1; min-width: 0; font-size: 13px; opacity: .75; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.restbar .bar { position: absolute; left: 0; top: 0; height: 3px; background: var(--accent); }
.restbar button { min-height: 40px; padding: 8px 12px; border-radius: 10px; background: color-mix(in srgb, var(--bg) 14%, transparent); color: var(--bg); font: 600 14px/1 var(--f-body); }
.restbar.fim { background: var(--ok); }

/* Folhas */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(10, 12, 15, .45); animation: fade .2s; }
.sheet {
  position: relative; width: 100%; max-width: 640px; max-height: calc(100% - 28px - env(safe-area-inset-top, 0px)); overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: var(--bg); border-radius: 20px 20px 0 0; animation: subir .24s cubic-bezier(.2, .8, .2, 1);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 8px; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 16px; overscroll-behavior: contain;
}
.sheet > * { flex-shrink: 0; }
.sheet .grab { width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto 2px; flex: none; }
.sheet .shead { display: flex; align-items: flex-start; gap: 10px; position: sticky; top: -8px; background: var(--bg); padding-block: 6px; z-index: 2; }
@keyframes subir { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .sheet, .sheet-backdrop { animation: none; } }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + 18px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 12px; font: 600 15px/1.3 var(--f-body);
  box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center;
}

/* Coach */
.chat { display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 92%; padding: 11px 14px; border-radius: 16px; font-size: 16px; line-height: 1.45; min-width: 0; overflow-wrap: anywhere; }
.msg.u { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 5px; white-space: pre-wrap; }
.msg.a { align-self: flex-start; background: var(--surface); box-shadow: var(--shadow); border-bottom-left-radius: 5px; }
.msg.a .md { display: flex; flex-direction: column; gap: 8px; }
.md h4 { font: 700 17px/1.2 var(--f-display); letter-spacing: .01em; margin-top: 4px; }
.md ul, .md ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.md code { font-size: 14px; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }
.exlink { display: inline; color: var(--accent); font-weight: 600; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 2px; }
.thinking { display: inline-flex; gap: 8px; align-items: center; color: var(--ink-3); font-size: 15px; }
.thinking i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); animation: pulse 1.2s infinite; }
.thinking i:nth-child(2) { animation-delay: .2s; } .thinking i:nth-child(3) { animation-delay: .4s; }
@keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
.composer { position: sticky; bottom: 10px; display: flex; gap: 8px; align-items: flex-end; background: var(--bg); padding-top: 8px; z-index: 5; }
.composer textarea { flex: 1; min-height: 46px; max-height: 160px; resize: none; border-radius: 14px; }
.composer .send { width: 46px; height: 46px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.composer .send svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.composer .send.stop { background: var(--ink); color: var(--bg); }
.proposal { border: 1.5px solid var(--accent); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); align-self: stretch; }
.proposal .pday { border-top: 1px solid var(--line); padding-top: 8px; }
.proposal .pday summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 8px; }
.proposal .pday summary::-webkit-details-marker { display: none; }
.proposal .pday ul { margin: 8px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14.5px; }

/* Progresso */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border-radius: 12px; padding: 12px; box-shadow: var(--shadow); min-width: 0; }
.stat b { display: block; font: 700 28px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12.5px; color: var(--ink-3); }
.vbar { display: grid; grid-template-columns: 104px 1fr 34px; gap: 10px; align-items: center; font-size: 14px; }
.vbar .track { position: relative; height: 10px; border-radius: 99px; background: var(--surface-2); }
.vbar .track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: var(--ink-3); }
.vbar .track i.ok { background: var(--ok); } .vbar .track i.warn { background: var(--warn); } .vbar .track i.hi { background: var(--plate-20); }
.vbar .track .z { position: absolute; top: -3px; bottom: -3px; border-left: 1.5px dashed var(--ink-3); opacity: .6; }
.vbar b { text-align: right; font: 700 16px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-3); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }

.empty { text-align: center; padding: 26px 18px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty .h2 { font-size: 24px; }
.plate { width: 54px; height: 54px; border-radius: 50%; border: 9px solid var(--accent); position: relative; }
.plate::after { content: ''; position: absolute; inset: 9px; border-radius: 50%; background: var(--ink); }

.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.stepper button { width: 36px; height: 38px; font: 700 20px/1 var(--f-display); color: var(--ink-2); }
.stepper b { min-width: 26px; text-align: center; font: 700 18px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.plitem { display: flex; flex-direction: column; gap: 10px; padding: 12px 0; }
.plitem + .plitem { border-top: 1px solid var(--line); }
.plitem .ctl { display: grid; grid-template-columns: auto 1fr 1fr; gap: 8px; align-items: end; }
.mini { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: var(--ink-3); background: var(--surface-2); flex: none; }
.mini svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.pick { position: relative; }
.pick.on::after { content: '✓'; position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; }
.pick.on .nm { color: var(--accent); }

/* Bi-sets e superséries */
.ordem { display: inline-block; font: 700 13px/1 var(--f-display); letter-spacing: .02em; background: var(--accent); color: var(--accent-ink); border-radius: 6px; padding: 3px 6px; vertical-align: 2px; }
.plitem.inblock { background: color-mix(in srgb, var(--accent-soft) 60%, transparent); border-radius: 12px; padding: 12px; }
.plitem.inblock + .plitem.inblock, .linkrow + .plitem.inblock { border-top: 0; }
.blkhead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--line); }
.linkrow { display: flex; justify-content: center; padding-block: 2px; }
.linkbtn { display: inline-flex; gap: 6px; align-items: center; min-height: 32px; font: 600 13px/1 var(--f-body); color: var(--ink-3); padding: 6px 12px; border-radius: 99px; border: 1px dashed var(--line); background: var(--surface); }
.linkbtn.on { color: var(--accent); border: 1px solid var(--accent); background: var(--accent-soft); }
.linkbtn svg, .btn svg.link { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.exrow.inblock { background: color-mix(in srgb, var(--accent-soft) 60%, transparent); border-radius: 10px; padding-inline: 10px; }
.exrow.inblock + .exrow.inblock { border-top: 0; margin-top: 2px; }
.card.combo { border: 1.5px solid var(--accent); gap: 14px; }
.setrow.prox .okbtn { box-shadow: 0 0 0 2.5px var(--accent); color: var(--accent); }
.setrow.prox .input { border-color: var(--accent); }

/* Cronômetro, ocupado e anilhas */
.btn.timer { min-height: 46px; font: 700 16px/1 var(--f-display); letter-spacing: .02em; background: var(--accent-soft); color: var(--accent); padding-inline: 10px; }
.ocupado { gap: 8px; }
.barbell { display: flex; align-items: center; gap: 2px; min-height: 100px; padding-block: 6px; overflow-x: auto; }
.barbell .manga { width: 28px; height: 10px; background: var(--ink-3); border-radius: 3px; flex: none; }
.barbell .ponta { width: 14px; height: 10px; background: var(--ink-3); border-radius: 3px; flex: none; }
.barbell .placa { width: 20px; height: var(--h); background: var(--c); border-radius: 4px; box-shadow: inset 0 0 0 1px var(--line); display: grid; place-items: center; flex: none; }
.barbell .placa b { font: 700 10px/1 var(--f-display); writing-mode: vertical-rl; transform: rotate(180deg); color: var(--ink); background: var(--surface); border-radius: 3px; padding: 2px 1px; }
/* Gráficos */
.graf { display: flex; flex-direction: column; gap: 4px; }
.graf svg { width: 100%; height: auto; display: block; overflow: visible; }
.graf .grid { stroke: var(--line); stroke-width: 1; }
.graf .eixo { fill: var(--ink-3); font: 500 10px var(--f-body); }
.graf .valor { fill: var(--ink-2); font: 700 11px var(--f-body); }
.graf .linha { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.graf .area { fill: var(--accent); opacity: .1; }
.graf .ponto { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.graf .destaque { fill: none; stroke: var(--accent); stroke-width: 2; }
.graf .coluna { fill: var(--accent); }
.graf .alvo { fill: transparent; cursor: pointer; }
.readout { font-size: 13.5px; color: var(--ink-2); min-height: 20px; font-variant-numeric: tabular-nums; }
/* Calendário */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal-h { font: 600 11px/1 var(--f-body); color: var(--ink-3); padding: 4px 0; }
.cal-d { width: 100%; max-width: 42px; aspect-ratio: 1; margin: 0 auto; display: grid; place-items: center; border-radius: 50%; font: 600 14px/1 var(--f-body); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cal-d.on { background: var(--accent); color: var(--accent-ink); }
.cal-d.hj { box-shadow: inset 0 0 0 2px var(--ink); }
.mini:disabled { opacity: .35; cursor: default; }
/* Fotos de progresso */
.fotos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.fotos.dois { grid-template-columns: 1fr 1fr; }
.foto { position: relative; aspect-ratio: 3 / 4; margin: 0; border-radius: 12px; overflow: hidden; display: grid; place-items: center; background: var(--surface-2); border: 1px dashed var(--line); cursor: pointer; font: 600 13px/1.2 var(--f-body); color: var(--ink-3); text-align: center; }
.foto img { width: 100%; height: 100%; object-fit: cover; }
.foto.ver { cursor: default; border-style: solid; }
.foto figcaption { position: absolute; left: 6px; bottom: 6px; background: rgba(10, 12, 15, .6); color: #fff; font-size: 11.5px; padding: 3px 6px; border-radius: 6px; }

/* Visual esportivo */
.hero { position: relative; overflow: hidden; color: var(--hero-ink); background: linear-gradient(135deg, var(--hero) 0%, var(--hero-2) 100%); box-shadow: 0 12px 30px rgba(10, 20, 48, .22);
  --ink: var(--hero-ink); --ink-2: var(--hero-ink-2); --ink-3: var(--hero-ink-2); --line: rgba(255, 255, 255, .14); --surface: transparent; --surface-2: rgba(255, 255, 255, .1);
  --accent: var(--volt); --accent-soft: rgba(255, 255, 255, .12); --mus-sec: #6f86c9; --mus-off: rgba(255, 255, 255, .17); --body: rgba(255, 255, 255, .07); }
.hero::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(-60deg, transparent 0 26px, rgba(255, 255, 255, .035) 26px 52px); }
.hero > * { position: relative; }
.hero .eyebrow { color: var(--volt); }
.display { font: italic 800 34px/.95 var(--f-display); letter-spacing: .005em; text-transform: uppercase; text-wrap: balance; }
.hero-stats { display: flex; gap: 22px; }
.hero-stats b { display: block; font: italic 800 30px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.hero-stats span { font: 600 11.5px/1.2 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--hero-ink-2); }
.btn.go { background: var(--volt); color: var(--volt-ink); font: italic 800 20px/1 var(--f-display); letter-spacing: .03em; text-transform: uppercase; }
.btn.go.sm { font-size: 16px; min-height: 38px; }
.btn.go svg { fill: currentColor; stroke: none; width: 16px; height: 16px; }
.score .wk-time { font: italic 800 42px/1 var(--f-display); }
.score .wk-time small { font-size: 22px; color: var(--hero-ink-2); }
.score .progress { height: 8px; background: rgba(255, 255, 255, .14); }
.score .progress > i { background: var(--volt); }
.seq { display: inline-block; font: italic 800 14px/1 var(--f-display); background: var(--ink); color: var(--bg); border-radius: 6px; padding: 3px 6px; vertical-align: 2px; font-variant-numeric: tabular-nums; }
.day.sel { background: var(--hero); border-color: var(--hero); color: var(--hero-ink); }
.day.sel i, .day.sel.done i { color: var(--volt); }
.day b { font-style: italic; font-weight: 800; }
.restbar { background: linear-gradient(135deg, var(--hero) 0%, var(--hero-2) 100%); color: var(--hero-ink); }
.restbar .rt { font-style: italic; font-weight: 800; color: var(--volt); }
.restbar .bar { background: var(--volt); }
.restbar button { background: rgba(255, 255, 255, .14); color: var(--hero-ink); }
.restbar.fim { background: var(--ok); }
.restbar.fim .rt { color: #fff; }
/* Trocar exercício */
.exline { display: flex; align-items: center; gap: 8px; min-width: 0; }
.exline .exrow { flex: 1; }
.exline + .exline, .trocado + .exline { border-top: 1px solid var(--line); }
/* bloco (bi-set, supersérie) na lista do dia: a linha inteira fica tingida, com o botão Trocar dentro */
.exline:has(> .exrow.inblock) { background: color-mix(in srgb, var(--accent-soft) 60%, transparent); border-radius: 10px; padding-right: 8px; }
.exline:has(> .exrow.inblock) + .exline:has(> .exrow.inblock) { border-top: 0; margin-top: 2px; }
.exline > .exrow.inblock { background: none; }
.swapbtn { flex: none; display: inline-flex; align-items: center; gap: 4px; min-height: 36px; padding: 6px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font: 700 13px/1 var(--f-body); }
.swapbtn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.trocado { font-size: 13px; color: var(--warn); padding: 0 0 8px 76px; }
.linkish { color: var(--accent); font-weight: 700; text-decoration: underline; text-underline-offset: 2px; }
.trocaatual { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 12px; background: var(--surface-2); }
.trocaatual .nm { font: italic 700 19px/1.1 var(--f-display); }
.exrow.troca { align-items: center; }
.exrow.troca .tag { margin-top: 4px; }
.eqv { flex: none; min-width: 58px; text-align: center; }
.eqv b { display: block; font: italic 800 21px/1 var(--f-display); color: var(--accent); font-variant-numeric: tabular-nums; }
.eqv span { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: var(--surface-2); }
.seg button { min-height: 40px; border-radius: 9px; font: 700 14px/1.1 var(--f-body); color: var(--ink-2); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

.input.grande { font: 700 24px/1 var(--f-body); min-height: 54px; font-variant-numeric: tabular-nums; }
.lembrete { border: 1.5px solid var(--accent); }

/* Séries: − / +, remover e desfazer */
.stepper.serie b { min-width: 76px; font: 700 15px/1 var(--f-body); }
.stepper button:disabled { opacity: .35; cursor: default; }
button.setno { min-height: 36px; border-radius: 9px; background: var(--surface-2); }
button.setno.on { background: var(--bad); color: #fff; }
.setacoes { display: flex; gap: 8px; padding-left: 42px; flex-wrap: wrap; }
.toast { display: flex; align-items: center; gap: 12px; }
.toast[hidden] { display: none; }
.toast .desfazer { color: var(--volt); font: 800 15px/1 var(--f-body); text-transform: uppercase; letter-spacing: .03em; padding: 4px 2px; }

.cargainfo { font-size: 13.5px; color: var(--ink-2); background: var(--accent-soft); border-radius: 10px; padding: 8px 10px; }
.motivo { padding-left: 42px; font-size: 13px; font-weight: 600; color: var(--accent); }

details.fold summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 8px; font: 700 17px/1.2 var(--f-display); letter-spacing: .01em; }
details.fold summary::-webkit-details-marker { display: none; }
details.fold summary::after { content: '+'; font-size: 22px; color: var(--ink-3); }
details.fold[open] summary::after { content: '–'; }
details.fold > div { padding-top: 10px; display: flex; flex-direction: column; gap: 10px; }

/* Mapa muscular */
.bodymap { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; width: 100%; max-width: 320px; margin-inline: auto; }
.bodymap.sm { max-width: 150px; margin: 0; gap: 2px; }
.bodymap.md { max-width: 260px; }
.bodymap figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.bodymap svg { width: 100%; height: auto; display: block; overflow: visible; }
.bodymap .corpo { fill: var(--body); }
.bodymap .mus path { stroke: var(--surface); stroke-width: .5; stroke-linejoin: round; transition: fill .2s; }
.bodymap .mus[data-a] { cursor: pointer; }
.bodymap .mus.sel path { stroke: var(--ink); stroke-width: 1.1; }
.bodymap .mus[data-a]:focus-visible { outline: none; }
.bodymap .mus[data-a]:focus-visible path { stroke: var(--ink); stroke-width: 1.1; }
.bodymap figcaption { font: 600 11.5px/1 var(--f-body); color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase; }
.bodymap.sm figcaption { display: none; }
.daymap { display: grid; grid-template-columns: 150px 1fr; gap: 12px; align-items: center; }
.musinfo { display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 12px; background: var(--surface-2); }
.pct { font: 700 22px/1 var(--f-display); font-variant-numeric: tabular-nums; }

@media (min-width: 560px) {
  .title { font-size: 34px; }
  .thumb { width: 76px; }
}

/* App instalado: sem chat; a página ocupa a tela inteira do iPhone (sem faixa sobrando embaixo) */

<script>

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = (o) => JSON.parse(JSON.stringify(o ?? null));
const sum = (a) => a.reduce((x, y) => x + y, 0);

const fmtKg = (n) => (Math.round(n * 10) / 10).toLocaleString('pt-BR');
const fmtData = (ts, op = { day: '2-digit', month: 'short' }) => new Date(ts).toLocaleDateString('pt-BR', op).replace('.', '');
const fmtMin = (ms) => Math.max(1, Math.round(ms / 60000));
const fmtClock = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); const m = Math.floor(s / 60); return (m >= 60 ? Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0') : m) + ':' + String(s % 60).padStart(2, '0'); };
const NIVEL = { 1: 'Iniciante', 2: 'Intermediário', 3: 'Avançado' };
const ICON = {
  check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',

};

// ───────── Catálogo ─────────
const EX = {};
const FAM = {};
for (const f of FAMILIAS) {
  FAM[f.id] = f;
  f.ids = [];
  for (const [id, nome, eq, nivel, img, passos, dica] of f.ex) {

}
const exNome = (id) => EX[id]?.nome || 'Exercício removido';
const imgUrl = (id) => `img/${id}.webp`;
// Miniaturas: um mosaico só (img/miniaturas.webp, 16 por linha, na ordem do catálogo); cada miniatura é um recorte dele.
// Uma imagem só carrega mais rápido que centenas de arquivos e cabe no limite de arquivos do app publicado.
const ATLAS = (() => { const m = {}; let n = 0; for (const f of FAMILIAS) for (const e of f.ex) m[e[0]] = n++; return { m, linhas: Math.ceil(n / 16) }; })();
const thumbAtlas = (i, rotulo, cls = '') => `<div class="thumb at ${cls}" role="img" aria-label="${esc(rotulo)}" style="background-size:1600% ${ATLAS.linhas * 100}%;background-position:${((i % 16) / 15) * 100}% ${(Math.floor(i / 16) / Math.max(1, ATLAS.linhas - 1)) * 100}%"></div>`;
const thumb = (id, cls = '') => (!EX[id] || EX[id].custom ? thumbCustom(id, cls) : thumbAtlas(ATLAS.m[id], exNome(id), cls));
const animHtml = (id) => EX[id]?.custom ? animCustom(EX[id]) : `<div class="anim" data-anim style="--fr:0">
  <div class="fr f0" style="background-image:url('${imgUrl(id)}')"></div>
  <div class="fr f1" style="background-image:url('${imgUrl(id)}')"></div>
  <div class="dots" aria-hidden="true"><span></span><span></span></div>
  <div class="ctrl"><button data-a="animSpeed">Lento</button><button data-a="animPause">Pausar</button></div>
</div>`;
const isCardio = (id) => ['cardio', 'mobilidade'].includes(EX[id]?.grupo);
const ytUrl = (id) => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(exNome(id) + ' execução correta');

function parseFaixa(reps) {
  const m = String(reps).match(/^\s*(\d+)\s*(?:-|a|–)\s*(\d+)\s*$/);
  if (m) return [+m[1], +m[2]];
  const n = String(reps).match(/^\s*(\d+)\s*$/);
  if (n) return [+n[1], +n[1]];
  return null; // tempo ou texto livre
}

// ───────── Armazenamento (nuvem do claude.ai com reserva no aparelho) ─────────
// App instalado na tela de início (fora do claude.ai): tudo fica no celular e funciona sem internet.
const INSTALADO = !!globalThis.FICHA_INSTALADO;
const S = { perfil: {}, config: {}, sessao: null, playlists: {}, treinos: {}, conversas: {}, medidas: {}, exercicios: {}, apagados: {}, modo: 'local', pronto: false };
let db = null;
const LS = 'ficha-coach-v1';
const DOCS = { perfil: 'app/perfil', config: 'app/config', sessao: 'app/sessao' };
const COLS = ['playlists', 'treinos', 'conversas', 'medidas', 'exercicios'];
const CHAVES_LS = ['perfil', 'config', 'sessao', 'playlists', 'treinos', 'conversas', 'medidas', 'exercicios', 'apagados'];
// Pendências de envio (caminho → 'set' | 'del'). Ficam guardadas no aparelho até a nuvem confirmar,
// para que um treino salvo sem internet nunca se perca.
let pend = {};
function lsLoad() {
  try { const o = JSON.parse(localStorage.getItem(LS) || 'null'); if (o) { for (const k of CHAVES_LS) if (o[k]) S[k] = o[k]; pend = o.pend || {}; } } catch (e) {}
  cfgVista = fotoCfg(S.config);
}
// App instalado: hora da última mudança de cada campo da config (_ts). Na sincronização, cada campo fica com a
// mudança mais recente entre o celular e o GitHub, sem que um ajuste qualquer apague, por exemplo, a troca de playlist.
let cfgVista = {};
const fotoCfg = (c) => Object.fromEntries(Object.entries(c || {}).filter(([k]) => k !== '_ts' && k !== 'rev').map(([k, v]) => [k, JSON.stringify(v)]));
function carimbarConfig(c) {
  const agora = Date.now(); const ts = { ...(c._ts || {}) };
  for (const [k, v] of Object.entries(fotoCfg(c))) if (v !== cfgVista[k]) ts[k] = agora;
  c._ts = ts; cfgVista = fotoCfg(c);
}
let lsTimer;
function lsSave() {
  clearTimeout(lsTimer);
  lsTimer = setTimeout(() => { try { const o = { pend }; for (const k of CHAVES_LS) o[k] = S[k]; localStorage.setItem(LS, JSON.stringify(o)); } catch (e) {} }, 300);
}
const DOC_DE = Object.fromEntries(Object.entries(DOCS).map(([k, p]) => [p, k]));
function valorLocal(path) { if (DOC_DE[path]) return S[DOC_DE[path]]; const [c, id] = path.split('/'); return S[c]?.[id]; }
const nPend = () => Object.keys(pend).length;
// Cada pessoa grava na própria área privada do banco: data/users/<id>/ficha/... (ninguém mais vê, nem o dono do app).
let BASE = '';
const P = (rel) => BASE + rel;

const fila = {};
function enfileirar(path, fn) {
  fila[path] = (fila[path] || Promise.resolve()).then(fn).catch((e) => {
    if (e?.code === 'quota_exceeded') toast('Armazenamento cheio: apague treinos ou conversas antigas.');
    else if (e?.code !== 'revoked') { if (!S.semRede) { S.semRede = true; agendarRender(); } console.warn('db', path, e); }
  });
  return fila[path];
}
function enviarDoc(path) {
  if (!db || !pend[path]) return;
  const op = pend[path]; const val = valorLocal(path); const rev = val?.rev;
  enfileirar(path, async () => {
    if (op === 'del' || !val) await db.doc(P(path)).delete(); else await db.doc(P(path)).set(clone(val));
    const agora = valorLocal(path);
    if (pend[path] === op && (op === 'del' ? !agora : agora?.rev === rev)) { delete pend[path]; lsSave(); }
    if (S.semRede && !nPend()) { S.semRede = false; agendarRender(); }
  });
}
function enviarPendencias() { if (!db) return; for (const p of Object.keys(pend)) if (!adiados[p]) enviarDoc(p); }
const adiados = {};
// Grava um documento (ou remove com null): na hora no aparelho, e na nuvem assim que possível.
// manterRev: dados que vieram do outro app (sincronização) guardam a versão de lá, para não voltarem como novidade.
function gravar(chave, id, dados, atraso = 0, manterRev = false) {
  const path = id ? `${chave}/${id}` : DOCS[chave];
  if (dados && !(manterRev && dados.rev)) dados.rev = Date.now();
  if (id) { if (dados) S[chave][id] = dados; else delete S[chave][id]; } else S[chave] = dados;
  if (INSTALADO) {
    if (id && !dados) S.apagados[path] = Date.now(); // apagar também vale para a cópia no GitHub
    if (chave === 'config' && dados) { if (manterRev) cfgVista = fotoCfg(dados); else carimbarConfig(dados); }
    lsSave(); if (chave !== 'sessao' && chave !== 'conversas') agendarNuvem();
    return;
  }
  pend[path] = dados ? 'set' : 'del';
  lsSave();
  if (!db) return;
  clearTimeout(adiados[path]);
  const go = () => { delete adiados[path]; enviarDoc(path); };
  if (atraso) adiados[path] = setTimeout(go, atraso); else go();
}

async function iniciarArmazenamento() {
  lsLoad(); render(); // mostra na hora o que já está no aparelho
  if (INSTALADO) { S.modo = 'local'; S.motivoLocal = 'instalado'; S.pronto = true; iniciarInstalado(); render(); return; }
  let d = null, u = null, id = null;
  try { d = window.claude?.use ? await window.claude.use('db') : null; } catch (e) { d = null; }
  try { u = window.claude?.use ? await window.claude.use('user') : null; } catch (e) { u = null; }
  try { id = u ? await u.id() : null; } catch (e) { id = null; }
  if (!d || !id) { S.modo = 'local'; S.motivoLocal = d ? 'sem-conta' : 'fora'; S.pronto = true; render(); return; }
  BASE = `data/users/${id}/ficha/`;
  // Quem abre pelo link público sem permissão de gravar usa o app normalmente, com os dados guardados no próprio aparelho.
  // Sem internet a gravação de teste falha ou demora: isso não é falta de permissão, o app segue e a fila envia depois.
  const limite = (ms) => new Promise((_, no) => setTimeout(() => no({ code: 'tempo' }), ms));
  let acesso = 'ok';
  try { await Promise.race([d.doc(P('app/acesso')).set({ em: Date.now() }), limite(6000)]); }
  catch (e) { acesso = e?.code === 'invalid_argument' ? 'negado' : 'incerto'; }
  if (acesso === 'negado') { BASE = ''; S.modo = 'local'; S.motivoLocal = 'sem-permissao'; S.pronto = true; render(); return; }
  db = d; S.modo = 'nuvem'; if (acesso === 'incerto') S.semRede = true;
  if (acesso === 'ok') { try { if (await u.isOwner()) await Promise.race([migrarLegado(d), limite(15000)]); } catch (e) { console.warn('migração', e); } }
  const recebido = {};
  let reenvioT = null;
  const reenviar = () => { clearTimeout(reenvioT); reenvioT = setTimeout(enviarPendencias, 1500); };
  const talvezMigrar = (k, vazio) => {
    if (recebido[k]) return; recebido[k] = true;
    if (['playlists', 'treinos', 'perfil'].every((x) => recebido[x])) { S.colecoesOk = true; agendarRender(); }
    if (!vazio) return;
    // primeira vez na nuvem: envia o que já existia neste aparelho
    if (COLS.includes(k)) for (const id of Object.keys(S[k])) pend[`${k}/${id}`] = 'set';
    else if (S[k] && Object.keys(S[k]).length) pend[DOCS[k]] = 'set';
    reenviar();
  };
  for (const [k, path] of Object.entries(DOCS)) {
    db.doc(P(path)).onSnapshot((snap) => {
      if (snap.metadata.fromCache && !snap.exists) return;
      const inc = snap.exists ? clone(snap.data()) : null;
      const confirmado = !snap.metadata.fromCache && !snap.metadata.hasPendingWrites;
      if (!snap.metadata.fromCache) talvezMigrar(k, !snap.exists);
      if (adiados[path]) return; // há edição local ainda não enviada
      const loc = S[k];
      if (pend[path]) {
        const servidorAtrasado = pend[path] === 'del' ? !!inc : (!inc || (loc?.rev || 0) > (inc.rev || 0));
        if (servidorAtrasado) { reenviar(); return; }
        if (confirmado) delete pend[path];
      }
      if (inc && loc && (loc.rev || 0) > (inc.rev || 0)) return;
      if (!inc && k !== 'sessao' && recebido[k] && loc && Object.keys(loc).length) return;
      S[k] = inc || (k === 'sessao' ? null : {});
      lsSave(); agendarRender();
    }, () => {});
  }
  const q = {
    playlists: db.collection(P('playlists')),
    treinos: db.collection(P('treinos')).orderBy('inicio', 'desc').limit(400),
    conversas: db.collection(P('conversas')).orderBy('atualizadoEm', 'desc').limit(40),
    medidas: db.collection(P('medidas')).orderBy('data', 'desc').limit(300),
    exercicios: db.collection(P('exercicios'))
  };
  for (const k of COLS) {
    q[k].onSnapshot((snap) => {
      if (snap.metadata.fromCache && snap.empty) return;
      if (!snap.metadata.fromCache) talvezMigrar(k, snap.empty);
      const novo = {}; let atrasado = false;
      for (const doc of snap.docs) {
        const path = `${k}/${doc.id}`; const loc = S[k][doc.id]; const inc = clone(doc.data());
        if (pend[path] === 'del') { atrasado = true; continue; }
        if (adiados[path] || (loc && (loc.rev || 0) > (inc.rev || 0))) { novo[doc.id] = loc; if (pend[path]) atrasado = true; }
        else { novo[doc.id] = inc; if (pend[path] && !adiados[path] && !snap.metadata.fromCache && !doc.metadata.hasPendingWrites) delete pend[path]; }
      }
      // o que só existe neste aparelho (salvo sem internet) continua aqui e é reenviado
      for (const [id, v] of Object.entries(S[k])) { const path = `${k}/${id}`; if (!novo[id] && (adiados[path] || pend[path] === 'set')) { novo[id] = v; atrasado = true; } }
      S[k] = novo; lsSave(); agendarRender();
      if (atrasado) reenviar();
    }, () => {});
  }
  setTimeout(enviarPendencias, 2500);
  window.addEventListener('online', enviarPendencias);
  setInterval(() => { if (nPend()) enviarPendencias(); }, 45000);
  S.pronto = true; render();
}
// Antes, os dados do dono ficavam fora da área pessoal: na primeira abertura, copia tudo para lá (uma vez só).
async function migrarLegado(d) {
  const cfg = await d.doc(P('app/config')).get();
  if (cfg.exists && cfg.data()?.migrado) return;
  const minhas = await d.collection(P('playlists')).limit(1).get();

const treinosOrd = () => Object.values(S.treinos).sort((a, b) => b.inicio - a.inicio);

function historicoEx(exId, limite = 6) {

function cargaReduzida(ex, kg, fator) {

function sugestao(exId, repsAlvo) {
  const s = sugestaoBase(exId, repsAlvo);
  if (!s || !deloadAtivo()) return s;
  const ult = Math.max(0, ...(historicoEx(exId, 1)[0]?.sets || []).map((x) => x.kg));
  if (ult) { const kg = cargaReduzida(EX[exId], ult, 0.9); return { ...s, tipo: 'leve', kg, txt: `Semana leve: ${fmtKg(kg)} kg, parando com 3 ou mais repetições sobrando.` }; }

}
// Progressão dupla: completou o topo da faixa em todas as séries → sobe a carga.
function sugestaoBase(exId, repsAlvo) {
  const ex = EX[exId]; if (!ex || isCardio(exId)) return null;
  const h = historicoEx(exId, 1)[0]; if (!h) return null;
  const faixa = parseFaixa(repsAlvo); const ult = h.sets.map((s) => (s.kg ? fmtKg(s.kg) + '×' : '') + s.reps).join(', ');
  const base = { ult, data: h.data };
  if (!faixa) return { ...base, txt: 'Repita o que fez da última vez, com a mesma qualidade.' };
  const [mn, mx] = faixa;
  const kg = Math.max(...h.sets.map((s) => s.kg));
  const doTopo = h.sets.filter((s) => s.kg === kg);
  const falhas = h.sets.filter((s) => s.rir === 0).length;
  // Volta após pausa: mais de 14 dias sem o exercício → 10% mais leve; mais de 30 dias → 20%.
  const diasSem = (Date.now() - h.data) / 864e5;
  if (diasSem > 14) {
    const d = Math.floor(diasSem); const pct = diasSem > 30 ? '20%' : '10%';
    if (!kg) return { ...base, tipo: 'pausa', reps: Math.max(1, Math.max(...doTopo.map((s) => s.reps)) - 2), txt: `${d} dias sem este exercício: faça 2 repetições a menos que da última vez e retome aos poucos.` };
    const novo = cargaReduzida(ex, kg, diasSem > 30 ? 0.8 : 0.9);
    return { ...base, tipo: 'pausa', kg: novo, reps: mn, txt: `${d} dias sem este exercício: volte com ${fmtKg(novo)} kg (cerca de ${pct} menos) e recupere a carga em 1 ou 2 treinos.` };
  }
  if (!kg) {
    if (doTopo.every((s) => s.reps >= mx)) return { ...base, tipo: 'subir', reps: mx + 2, txt: `Tente ${mx + 1}–${mx + 2} repetições ou passe para uma variação mais difícil.` };
    return { ...base, reps: Math.min(mx, Math.max(...doTopo.map((s) => s.reps)) + 1), txt: 'Tente 1 repetição a mais em cada série.' };
  }
  if (doTopo.every((s) => s.reps >= mx) && falhas < 2) {
    // ajuste pelo esforço: sobrou 3+ repetições em todas as séries → sobe o dobro
    const folga = h.sets.every((s) => s.rir != null && s.rir >= 3);
    const novo = kg + incremento(ex, kg) * (folga ? 2 : 1);
    return { ...base, tipo: 'subir', kg: novo, reps: mn, txt: folga ? `Sobraram 3 ou mais repetições em todas as séries: suba direto para ${fmtKg(novo)} kg e busque ${mn}–${mx} repetições.` : `Suba para ${fmtKg(novo)} kg e busque ${mn}–${mx} repetições.` };
  }
  if (platoEx(exId)) {
    const alt = altPlato(exId);
    return { ...base, tipo: 'plato', kg, reps: mn, alt, txt: `Sem evolução nos últimos 3 treinos. Mantenha ${fmtKg(kg)} kg hoje${alt ? ` e considere trocar por ${exNome(alt)} por 4 semanas` : ''}, ou faça uma semana leve.` };
  }
  if (doTopo.some((s) => s.reps < mn)) {
    const abaixo = historicoEx(exId, 2).every((x) => x.sets.some((s) => s.reps < mn));
    if (abaixo && historicoEx(exId, 2).length === 2) {
      const novo = Math.max(0, kg - incremento(ex, kg));
      return { ...base, tipo: 'descer', kg: novo, reps: mn, txt: `Duas sessões abaixo de ${mn} repetições: baixe para ${fmtKg(novo)} kg e recupere a técnica.` };
    }
    return { ...base, kg, reps: mn, txt: `Mantenha ${fmtKg(kg)} kg e tente chegar a ${mn} repetições em todas as séries.` };
  }
  const melhor = Math.max(...doTopo.map((s) => s.reps));
  return { ...base, kg, reps: Math.min(mx, melhor + 1), txt: `Mantenha ${fmtKg(kg)} kg e tente 1 repetição a mais por série.` };
}

function musculosDoTreino(itens) {
  const p = new Set(), s = new Set();
  for (const it of itens || []) { if (isCardio(it.ex)) continue; const m = muscEx(it.ex); m.p.forEach((x) => p.add(x)); m.s.forEach((x) => s.add(x)); }

// Recuperação: cada músculo precisa de ~48 h após ser treinado; +24 h se a última sessão teve 6+ séries para ele,
// +12 h se alguma série foi até a falha. Séries principais contam 1, auxiliares 0,5 (método fracionado de Pelland et al.).
function estadoMuscular() {
  const agora = Date.now(); const lim = agora - 7 * 864e5;
  const r = {}; for (const m in MUSC) r[m] = { series: 0, ultimo: 0, ultimaSessao: 0, falha: false, pct: null, horas: null };
  for (const t of treinosOrd()) {
    if (t.inicio < lim) break;
    const ts = t.fim || t.inicio; const porM = {}; const falhaM = {};
    for (const it of t.itens || []) {
      if (isCardio(it.ex)) continue;
      const v = seriesValidas(it); if (!v.length) continue;
      const { p, s } = muscEx(it.ex); const falha = v.some((x) => x.rir === 0);
      for (const m of p) { porM[m] = (porM[m] || 0) + v.length; if (falha) falhaM[m] = true; }
      for (const m of s) porM[m] = (porM[m] || 0) + v.length * 0.5;
    }
    for (const [m, n] of Object.entries(porM)) { r[m].series += n; if (!r[m].ultimo) { r[m].ultimo = ts; r[m].ultimaSessao = n; r[m].falha = !!falhaM[m]; } }
  }
  for (const x of Object.values(r)) {
    if (!x.ultimo) continue;
    x.horas = (agora - x.ultimo) / 36e5;
    x.precisa = 48 + (x.ultimaSessao >= 6 ? 24 : 0) + (x.falha ? 12 : 0);
    x.pct = Math.min(100, Math.round((x.horas / x.precisa) * 100));
  }
  return r;
}
const corRecuperacao = (est) => (m) => { const p = est[m].pct; return p == null ? COR_OFF : p < 60 ? 'var(--plate-25)' : p < 90 ? 'var(--plate-15)' : 'var(--plate-10)'; };
const corVolume = (est) => (m) => { const n = est[m].series; return n <= 0 ? COR_OFF : n < 10 ? COR_S : n <= 20 ? COR_P : 'var(--mus-alto)'; };
const fmtHoras = (h) => (h < 1 ? 'há menos de 1 hora' : h < 24 ? `há ${Math.round(h)} h` : `há ${Math.round(h / 24)} dia${Math.round(h / 24) > 1 ? 's' : ''}`);
const fmtSeries = (n) => { const v = Math.round(n * 2) / 2; return v.toLocaleString('pt-BR') + (v === 1 ? ' série' : ' séries'); };

}

function sheetPerfil() {

  const sel = (id, obj, v) => `<select id="${id}" class="input"><option value="">Escolha</option>${Object.entries(obj).map(([k, t]) => `<option value="${k}" ${v === k ? 'selected' : ''}>${t}</option>`).join('')}</select>`;

  <p class="muted small">Estas respostas orientam o Coach, as metas de carga e as trocas de exercício.</p>
  <div class="field"><label for="pfNome">Nome</label><input id="pfNome" class="input" value="${esc(p.nome || '')}" autocomplete="given-name"></div>
  <div class="grid2"><div class="field"><label for="pfSexo">Sexo</label>${sel('pfSexo', { m: 'Masculino', f: 'Feminino', o: 'Prefiro não dizer' }, p.sexo)}</div><div class="field"><label for="pfIdade">Idade</label><input id="pfIdade" class="input" inputmode="numeric" value="${esc(p.idade || '')}"></div></div>
  <div class="grid2"><div class="field"><label for="pfAlt">Altura (cm)</label><input id="pfAlt" class="input" inputmode="numeric" value="${esc(p.altura || '')}"></div><div class="field"><label for="pfPeso">Peso (kg)</label><input id="pfPeso" class="input" inputmode="decimal" value="${esc(p.peso || '')}"></div></div>
  <div class="field"><label for="pfObj">Objetivo principal</label>${sel('pfObj', OBJ, p.objetivo)}</div>
  <div class="field"><label for="pfExp">Experiência com musculação</label>${sel('pfExp', EXP, p.experiencia)}</div>
  <div class="grid2"><div class="field"><label for="pfDias">Dias por semana</label>${sel('pfDias', { 2: '2 dias', 3: '3 dias', 4: '4 dias', 5: '5 dias', 6: '6 dias' }, String(p.dias || ''))}</div><div class="field"><label for="pfMin">Tempo por treino</label>${sel('pfMin', { 30: '30 min', 45: '45 min', 60: '1 hora', 75: '1h15', 90: '1h30' }, String(p.minutos || ''))}</div></div>
  <div class="field"><label for="pfRest">Dores, lesões ou limitações</label><textarea id="pfRest" class="input" placeholder="Ex.: dor no joelho direito ao agachar fundo">${esc(p.restricoes || '')}</textarea></div>
  <div class="field"><label for="pfPref">Preferências</label><textarea id="pfPref" class="input" placeholder="Ex.: gosto de máquinas, não gosto de correr, quero glúteos mais fortes">${esc(p.preferencias || '')}</textarea></div>
  <div class="section"><h2>Triagem de saúde (PAR-Q)</h2><p class="faint">Marque se a resposta for "sim".</p>${PARQ.map((q, i) => `<label class="check"><input type="checkbox" id="pq${i}" ${pq[i] ? 'checked' : ''}> ${esc(q)}</label>`).join('')}</div>
  <button class="btn primary big block" data-a="salvarPerfil">Salvar</button>`;
}

function sheetTreino(id) {
  const t = S.treinos[id]; if (!t) return shead('Treino');
  const SENS = ['', 'Muito leve', 'Leve', 'Na medida', 'Pesado', 'Exaustivo'];
  return `${shead(t.titulo || 'Treino', fmtData(t.inicio, { weekday: 'long', day: '2-digit', month: 'long' }))}
  <div class="stats"><div class="stat"><b>${t.duracaoMin || '–'}</b><span>minutos</span></div><div class="stat"><b>${sum((t.itens || []).map((i) => seriesValidas(i).length))}</b><span>séries</span></div><div class="stat"><b>${Math.round(t.volumeKg || 0).toLocaleString('pt-BR')}</b><span>kg levantados</span></div></div>
  ${t.sensacao ? `<div class="row wrap"><span class="tag">Sensação: ${SENS[t.sensacao]}</span>${t.dor ? `<span class="tag bad">Dor: ${esc(t.dor)}</span>` : ''}</div>` : ''}
  ${t.obs ? `<p class="small">${esc(t.obs)}</p>` : ''}
  <div class="card tight">${(t.itens || []).map((it) => { const ss = (it.series || []).filter((s) => s.feito); return `<div class="exrow">${thumb(it.ex)}<div class="grow"><div class="nm">${esc(exNome(it.ex))}</div><div class="meta num">${ss.map((s) => (s.tipo === 'aq' ? 'AQ ' : '') + (s.kg ? fmtKg(+s.kg) + '×' : '') + (s.reps || '✓') + (s.rir != null ? ` (${s.rir === 3 ? '3+' : s.rir})` : '')).join(' · ') || 'Não feito'}</div></div></div>`; }).join('')}</div>
  ${UI.confirmar === 'delTreino' ? `<div class="callout bad">Apagar este treino do histórico?<div class="btnrow" style="margin-top:10px"><button class="btn danger" data-a="apagarTreino" data-id="${id}">Apagar</button><button class="btn" data-a="cancelarConfirma">Cancelar</button></div></div>` : `<button class="btn danger sm" data-a="pedirApagarTreino">Apagar do histórico</button>`}`;
}

// Seletor de exercícios (para playlist ou treino em andamento)
function sheetPicker() {
  const q = norm(UI.pkBusca); const sel = UI.pkSel || [];
  const sem = semExc();
  let lista = '';
  for (const f of FAMILIAS) {
    if (UI.pkGrupo && f.grupo !== UI.pkGrupo) continue;
    const ids = f.ids.filter((id) => !q || norm(EX[id].nome + ' ' + f.nome + ' ' + f.foco).includes(q));
    if (!ids.length) continue;
    lista += `<div class="lbl" style="margin-top:6px">${esc(f.nome)}</div><div class="card tight">${ids.map((id) => `<button class="exrow pick ${sel.includes(id) ? 'on' : ''}" data-a="pkToggle" data-id="${id}">${thumb(id)}<div class="grow" style="padding-right:34px"><div class="nm">${esc(EX[id].nome)}</div><div class="meta">${EX[id].custom ? 'Meu exercício · ' : ''}${EQUIP[EX[id].eq]}${sem.has(EX[id].eq) ? ' · sem na academia' : ''}</div></div></button>`).join('')}</div>`;
  }
  return `${shead('Adicionar exercícios', UI.pkModo === 'sessao' ? 'Treino de hoje' : 'Playlist')}
  <input class="input" type="search" data-in="pkBusca" value="${esc(UI.pkBusca || '')}" placeholder="Buscar" aria-label="Buscar exercício">
  <div class="chips scroll"><button class="chip sm ${!UI.pkGrupo ? 'on' : ''}" data-a="pkGrupo" data-v="">Todos</button>${Object.entries(GRUPOS).map(([k, v]) => `<button class="chip sm ${UI.pkGrupo === k ? 'on' : ''}" data-a="pkGrupo" data-v="${k}">${v}</button>`).join('')}</div>
  <div id="pkres" class="stack">${lista || '<p class="muted">Nada encontrado.</p>'}</div>

}

  for (const k of DIAS) dias[k] = { titulo: base?.dias?.[k]?.titulo || '', itens: (base?.dias?.[k]?.itens || []).map((it) => Array.isArray(it) ? { uid: uid(), ex: it[0], series: it[1], reps: it[2], desc: it[3], nota: it[4] || '', ...(it[5] ? { combo: 'c' + k + it[5] } : {}), ...(it[6] ? { esquema: it[6] } : {}) } : { ...it, uid: uid() }) };
  return { id, nome: base?.nome || 'Nova playlist', objetivo: base?.objetivo || '', descricao: base?.descricao || '', origem: base?.origem || 'manual', modo: base?.modo === 'sequencia' ? 'sequencia' : 'semana', dias, criadoEm: Date.now(), atualizadoEm: Date.now() };
}

// ───────── Carga inteligente série a série ─────────

function rrAlvo() {

// ───────── Trocar exercício: mesmo efeito, outro aparelho ─────────
// Equivalência = semelhança entre os músculos trabalhados (principais valem 1, auxiliares 0,5; cosseno entre os vetores).

function graficoBarras(id, barras, { h = 140 } = {}) {
  if (!barras.some((b) => b.v > 0)) return '';

  const tk = ticksBons(0, Math.max(...barras.map((b) => b.v)), 3); const Y = (y) => T + (1 - y / (tk.hi || 1)) * (H - T - B);
  const imax = barras.reduce((m, b, k) => (b.v > barras[m].v ? k : m), 0); GRAF[id] = barras.map((b) => ({ rotulo: b.rotulo }));
  const col = (x, y, w, hh) => { const r = Math.min(4, hh, w / 2); return `M${x},${y + hh} L${x},${y + r} Q${x},${y} ${x + r},${y} L${x + w - r},${y} Q${x + w},${y} ${x + w},${y + r} L${x + w},${y + hh} Z`; };
  return `<div class="graf"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de barras, ${barras.length} semanas">
    ${tk.t.map((v) => `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text class="eixo" x="${L - 6}" y="${(Y(v) + 3.5).toFixed(1)}" text-anchor="end">${fmtTick(v)}</text>`).join('')}
    ${barras.map((b, k) => { const x = L + slot * k + (slot - lw) / 2; const y = Y(b.v); const hh = H - B - y; const rot = k === imax || k === barras.length - 1;
      return `${b.v > 0 ? `<path class="coluna" d="${col(x, y, lw, hh)}"/>` : ''}${rot && b.v > 0 ? `<text class="valor" x="${x + lw / 2}" y="${y - 4}" text-anchor="middle">${fmtTick(b.v)}</text>` : ''}<text class="eixo" x="${x + lw / 2}" y="${H - 6}" text-anchor="middle">${b.rot}</text><rect class="alvo" data-pt="${id}:${k}" x="${L + slot * k}" y="${T}" width="${slot}" height="${H - T - B}"/>`; }).join('')}
  </svg><div class="readout" id="ro-${id}">${esc(barras[barras.length - 1].rotulo)}</div></div>`;
}

  catch (e) { src = await new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = URL.createObjectURL(file); }); }

// ───────── Alimentação: estimativas simples ─────────
// Gasto em repouso pela equação de Mifflin-St Jeor; fator de atividade pelos dias de treino; ajuste pelo objetivo.
// Proteína por kg (com obesidade, sobre um peso de referência de IMC 25); água ≈ 35 ml/kg + 0,5 L por hora de treino.
function nutricao(p = S.perfil) {
  const kg = +p.peso || +(medidasOrd().find((m) => m.peso)?.peso || 0); const cm = +p.altura; const idade = +p.idade;
  if (!kg || !cm || !idade) return null;
  const tmb = 10 * kg + 6.25 * cm - 5 * idade + (p.sexo === 'm' ? 5 : p.sexo === 'f' ? -161 : -78);
  const dias = +p.dias || 3; const fator = dias <= 2 ? 1.375 : dias <= 4 ? 1.55 : 1.65;
  const manut = tmb * fator; const obj = p.objetivo;
  let alvo = manut, meta = 'manter o peso';
  if (obj === 'emagrecimento') { alvo = Math.max(tmb * 1.1, manut - Math.min(500, manut * 0.2)); meta = 'perder gordura preservando músculo'; }
  else if (obj === 'hipertrofia') { alvo = manut + Math.min(300, manut * 0.1); meta = 'ganhar músculo com pouco ganho de gordura'; }
  else if (obj === 'forca') { alvo = manut + 150; meta = 'ganhar força com o peso estável ou subindo devagar'; }
  const m2 = (cm / 100) ** 2; const imc = kg / m2; const ref = imc > 30 ? 25 * m2 : kg;
  const [pmin, pmax] = obj === 'emagrecimento' ? [1.8, 2.2] : ['hipertrofia', 'forca'].includes(obj) ? [1.6, 2.2] : [1.2, 1.6];
  const r50 = (x) => Math.round(x / 50) * 50; const r5 = (x) => Math.round(x / 5) * 5;
  return { tmb: r50(tmb), manut: r50(manut), alvo: r50(alvo), meta, prot: [r5(ref * pmin), r5(ref * pmax)], agua: Math.round((kg * 0.035 + ((+p.minutos || 60) / 60) * 0.5) * 10) / 10, imc, kg, ajuste: ajusteCalorias(obj) };
}
// Ajuste fino pela balança: compara o ritmo real das últimas semanas com o ritmo saudável para o objetivo.
function ajusteCalorias(obj) {
  const lim = Date.now() - 42 * 864e5; const ps = medidasOrd().filter((m) => m.peso && m.data >= lim).reverse();
  if (ps.length < 2) return '';
  const a = ps[0], z = ps[ps.length - 1]; const sem = (z.data - a.data) / (7 * 864e5); if (sem < 2.5) return '';
  const ritmo = ((z.peso - a.peso) / a.peso / sem) * 100; const txt = `${ritmo > 0 ? '+' : ''}${fmtKg(ritmo)}% por semana`;
  if (obj === 'emagrecimento') {
    if (ritmo > -0.25) return `Pela balança, o peso está parado (${txt}). Reduza cerca de 150 kcal por dia e confira de novo em 2 a 3 semanas.`;
    if (ritmo < -1) return `O peso está caindo rápido (${txt}): risco de perder músculo. Aumente cerca de 150 kcal por dia.`;
    return `Ritmo bom de perda (${txt}). Mantenha.`;
  }
  if (obj === 'hipertrofia') {
    if (ritmo < 0) return `O peso está caindo (${txt}): para ganhar músculo, aumente cerca de 200 kcal por dia.`;
    if (ritmo < 0.1) return `O peso quase não sobe (${txt}). Aumente cerca de 150 kcal por dia.`;
    if (ritmo > 0.5) return `O peso sobe rápido (${txt}): parte pode ser gordura. Reduza cerca de 100 kcal por dia.`;
    return `Ritmo bom de ganho (${txt}). Mantenha.`;
  }
  return Math.abs(ritmo) > 0.5 ? `O peso está mudando ${txt}. Se a meta é manter, ajuste cerca de 150 kcal por dia.` : '';
}
function blocoNutricao() {
  const n = nutricao();
  if (!n) return `<div class="section"><h2>Alimentação e água</h2><div class="card"><p class="small muted">Com idade, altura, peso e sexo, o app estima suas calorias, proteína e água do dia.</p><button class="btn sm" data-a="abrirPerfil">Completar perfil</button></div></div>`;
  return `<div class="section"><h2>Alimentação e água</h2><div class="card">
    <div class="stats nut"><div class="stat"><b>${n.alvo.toLocaleString('pt-BR')}</b><span>kcal por dia</span></div><div class="stat"><b>${n.prot[0]}–${n.prot[1]}</b><span>g de proteína</span></div><div class="stat"><b>${fmtKg(n.agua)}</b><span>litros de água</span></div></div>

    <p class="faint" style="font-size:12.5px">Estimativa com erro de cerca de 10%: o ajuste fino vem da balança a cada 2 a 3 semanas. Para dieta individual, procure nutricionista; gestantes e pessoas com diabetes ou doença renal, só com orientação profissional.</p>
  </div></div>`;
}

// ───────── Ciclos de treino (mesociclos) ─────────
// Ciclo de 5 ou 6 semanas: o esforço sobe semana a semana (menos repetições sobrando) e a última semana é leve.
// O volume sobe pelo ajuste automático de séries; no início de cada ciclo, as séries extras do ciclo anterior voltam ao plano base.

  terra: { m: [1, 1.5, 2, 2.5, 3], f: [0.5, 1, 1.25, 1.75, 2.5] },
  desenv_barra: { m: [0.35, 0.55, 0.8, 1.1, 1.4], f: [0.2, 0.35, 0.5, 0.75, 1] }

  const t = S.perfil.sexo === 'm' ? pd.m : S.perfil.sexo === 'f' ? pd.f : pd.m.map((x, i) => (x + pd.f[i]) / 2);

// Arquivos (backup, planilhas, resumo): a folha Compartilhar do iPhone tem "Salvar em Arquivos"
function downloadsLocal() {
  return { save: async ({ filename, data }) => {
    const tipo = /\.json$/.test(filename) ? 'application/json' : /\.csv$/.test(filename) ? 'text/csv' : /\.png$/.test(filename) ? 'image/png' : 'application/octet-stream';
    const blob = data instanceof Blob ? data : new Blob([data], { type: tipo });
    const arq = new File([blob], filename, { type: blob.type || tipo });
    if (navigator.canShare?.({ files: [arq] })) {
      try { await navigator.share({ files: [arq] }); return { status: 'saved' }; } catch (e) { if (e?.name === 'AbortError') throw { code: 'declined' }; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    return { status: 'saved' };
  } };
}

// Fotos (medidas e aparelhos) guardadas no celular; o service worker as entrega em foto/<id>
function bancoFotos() {
  return new Promise((ok, no) => { const r = indexedDB.open('ficha-fotos', 1); r.onupgradeneeded = () => r.result.createObjectStore('fotos'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
}
function fotosLocal() {
  const tx = async (modo, fn) => { const bd = await bancoFotos(); return new Promise((ok, no) => { const t = bd.transaction('fotos', modo); fn(t.objectStore('fotos')); t.oncomplete = () => ok(); t.onerror = () => no(t.error); }); };
  return {
    upload: async (blob) => { const id = uid() + uid(); await tx('readwrite', (st) => st.put(blob, id)); return { id, url: fotoUrl(id), sizeBytes: blob.size, contentType: blob.type }; },
    delete: (id) => tx('readwrite', (st) => st.delete(id))
  };
}

// ───────── Sincronização com o repositório privado do aluno no GitHub ─────────
// Um arquivo dados.json guarda perfil, config, playlists, treinos, medidas e exercícios. O app lê, junta com o que
// tem no celular e grava de volta (o sha do GitHub impede que uma gravação apague a outra). Funciona sem internet:
// as mudanças ficam no celular e sobem na próxima vez que houver conexão. O treino em andamento não sobe.
const COLS_NUVEM = ['playlists', 'treinos', 'medidas', 'exercicios'];
const ARQ_NUVEM = 'dados.json';
const REPO_PADRAO = 'mikiedhavid-dot/ficha-coach-dados';
const CHAVE_NUVEM = LS + '-github';
const lerNuvemCfg = () => { try { const o = JSON.parse(localStorage.getItem(CHAVE_NUVEM) || 'null'); return o?.token && o?.repo ? o : null; } catch (e) { return null; } };
const ANO_MS = 365 * 864e5;
// Junta dois conjuntos de dados: cada documento fica com a versão mais nova (rev); apagar vence versões mais antigas;
// na config, cada campo fica com a mudança mais recente (_ts), e as listas de conquistas e treinos pulados se somam.
function juntarDados(a, b) {
  const r = { apagados: {} };
  for (const fonte of [a.apagados, b.apagados]) for (const [p, t] of Object.entries(fonte || {})) if (t > (r.apagados[p] || 0) && Date.now() - t < ANO_MS) r.apagados[p] = t;
  for (const k of COLS_NUVEM) {
    r[k] = {};
    for (const id of new Set([...Object.keys(a[k] || {}), ...Object.keys(b[k] || {})])) {
      const x = a[k]?.[id], y = b[k]?.[id]; const v = !x ? y : !y ? x : (y.rev || 0) > (x.rev || 0) ? y : x;
      if (v && (r.apagados[`${k}/${id}`] || 0) < (v.rev || 0)) r[k][id] = v;
    }
  }
  r.perfil = ((b.perfil?.rev || 0) > (a.perfil?.rev || 0) ? b.perfil : a.perfil) || {};
  const ca = a.config || {}, cb = b.config || {}, ta = ca._ts || {}, tb = cb._ts || {}; const cfg = {}, ts = {};
  for (const k of new Set([...Object.keys(ca), ...Object.keys(cb)])) {
    if (k === '_ts' || k === 'rev') continue;
    const deB = !(k in ca) || (k in cb && (tb[k] || 0) > (ta[k] || 0));
    cfg[k] = deB ? cb[k] : ca[k]; if ((deB ? tb[k] : ta[k]) != null) ts[k] = deB ? tb[k] : ta[k];
  }
  for (const k of ['conquistas', 'ignorados']) if (Array.isArray(ca[k]) && Array.isArray(cb[k])) cfg[k] = [...new Set([...ca[k], ...cb[k]])];
  cfg._ts = ts; cfg.rev = Math.max(ca.rev || 0, cb.rev || 0);
  r.config = cfg;
  return r;
}

function inlineMd(s) {
  return s
    .replace(/\[\[([a-z0-9_]+)\]\]/g, (m, id) => (EX[id] ? `<a href="#" class="exlink" data-a="verEx" data-id="${id}">${esc(EX[id].nome)}</a>` : id.replace(/_/g, ' ')))
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g, '$1<i>$2</i>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
}
function md(t) {
  let html = ''; let lista = null; let par = [];
  const fechar = () => { if (lista) { html += `</${lista}>`; lista = null; } };
  const flush = () => { if (par.length) { html += `<p>${inlineMd(par.join('<br>'))}</p>`; par = []; } };
  for (const raw of esc(t).split('\n')) {
    const l = raw.trimEnd(); let m;
    if (!l.trim()) { flush(); fechar(); continue; }
    if ((m = l.match(/^#{1,4}\s+(.*)/))) { flush(); fechar(); html += `<h4>${inlineMd(m[1])}</h4>`; continue; }
    if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { flush(); if (lista !== 'ul') { fechar(); html += '<ul>'; lista = 'ul'; } html += `<li>${inlineMd(m[1])}</li>`; continue; }
    if ((m = l.match(/^\s*(\d+)[.)]\s+(.*)/))) { flush(); if (lista !== 'ol') { fechar(); html += '<ol>'; lista = 'ol'; } html += `<li>${inlineMd(m[2])}</li>`; continue; }
    fechar(); par.push(l);
  }
  flush(); fechar(); return html;
}
